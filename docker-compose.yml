name: jungle-test

x-app: &app
  # Built once by the "migrate" service; the three instances reuse it.
  image: jungle-test:local
  pull_policy: never
  restart: unless-stopped
  stop_grace_period: 30s
  depends_on:
    migrate:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy
    localstack:
      condition: service_healthy
  environment: &app-env
    APP_ROLES: api,consumer,outbox,pending
    LOG_LEVEL: info
    HTTP_ADDR: ":8080"
    DATABASE_URL: postgres://jungle-app:${APP_DB_PASSWORD:-jungle-app-1234}@postgres:5432/jungle_test?sslmode=disable
    OIDC_ISSUER: http://localhost:8081/realms/jungle
    OIDC_JWKS_URL: http://keycloak:8080/realms/jungle/protocol/openid-connect/certs
    OIDC_AUDIENCE: jungle-api
    AWS_REGION: us-east-1
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    SQS_CONSUMER_ACCESS_KEY_ID: ${SQS_CONSUMER_ACCESS_KEY_ID:-test}
    SQS_CONSUMER_SECRET_ACCESS_KEY: ${SQS_CONSUMER_SECRET_ACCESS_KEY:-test}
    SQS_PUBLISHER_ACCESS_KEY_ID: ${SQS_PUBLISHER_ACCESS_KEY_ID:-test}
    SQS_PUBLISHER_SECRET_ACCESS_KEY: ${SQS_PUBLISHER_SECRET_ACCESS_KEY:-test}
    SHUTDOWN_TIMEOUT: 25s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jungle-1234}
      POSTGRES_DB: jungle_test
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-jungle-app-1234}
    ports: ["5432:5432"]
    volumes:
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8081:8080"]
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: sqs,iam
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports: ["4566:4566"]
    volumes:
      - ./deploy/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 3s
      timeout: 3s
      retries: 60

  migrate:
    build: .
    image: jungle-test:local
    entrypoint: ["/migrate", "up"]
    environment:
      MIGRATE_DATABASE_URL: postgres://jungle:${POSTGRES_PASSWORD:-jungle-1234}@postgres:5432/jungle_test?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Three independent instances (own process, memory and connection pool).
  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app1
    ports: ["8080:8080"]
  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2
    ports: ["8082:8080"]
  app3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app3
    ports: ["8083:8080"]

volumes:
  pgdata:
